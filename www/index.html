<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mi Diario</title>
  <meta name="description" content="Tu diario personal: escribe, guarda fotos y recuerda." />
  <meta name="theme-color" content="#6d4c2f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="book">

    <header class="topbar">
      <button id="btn-home" class="icon-btn hidden" aria-label="Volver al inicio">←</button>
      <h1 id="app-title" class="title">Mi Diario</h1>
      <div class="topbar-actions">
        <button id="btn-search" class="icon-btn" aria-label="Buscar">🔍</button>
        <button id="btn-new" class="btn-new" aria-label="Nueva entrada">＋</button>
      </div>
    </header>

    <div id="searchbar" class="searchbar hidden">
      <input id="search-input" type="search" placeholder="Buscar en mis entradas…" autocomplete="off" />
    </div>

    <main class="pages">

      <section id="view-list" class="page active" aria-label="Mis entradas">
        <div id="entries-list" class="entries"></div>
      </section>

      <section id="view-entry" class="page" aria-label="Leyendo entrada">
        <article id="entry-reader" class="reader"></article>
      </section>

      <section id="view-editor" class="page" aria-label="Escribir entrada">
        <form id="editor-form" class="editor" autocomplete="off">
          <div class="editor-head">
            <input id="entry-date" type="date" required />
            <div id="mood-picker" class="moods" role="radiogroup" aria-label="Estado de ánimo"></div>
          </div>
          <input id="entry-title" class="entry-title-input" type="text" placeholder="Título de hoy…" maxlength="80" />
          <textarea id="entry-text" placeholder="Querido diario…" rows="12"></textarea>
          <div class="editor-foot">
            <span id="char-count" class="char-count">0 caracteres</span>
            <button type="submit" class="btn-save">Guardar <span class="save-pen">✒️</span></button>
          </div>
          <div class="photos-block">
            <h3 class="photos-title">Fotos</h3>
            <div id="photo-grid" class="photo-grid"></div>
            <input id="photo-input" type="file" accept="image/*" multiple hidden />
            <button type="button" id="btn-add-photo" class="add-photo">📷 Añadir fotos</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-label="Foto ampliada">
    <img id="lightbox-img" src="" alt="" />
    <button id="lightbox-close" class="icon-btn lightbox-close" aria-label="Cerrar">✕</button>
  </div>

  <div id="confirm" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <p id="confirm-text">¿Borrar esta entrada para siempre?</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn-ghost">Cancelar</button>
        <button id="confirm-ok" class="btn-danger">Borrar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
